services:
  up-web-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional: public HTTPS URL for Up webhooks, e.g. https://upbank.example.com/api/webhooks
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # Optional: login lifetime in days (default 30). Slides forward on use.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Recommended when served over HTTPS: mark the session cookie Secure.
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-1}
      # Keep the session store on the mounted volume, not an ephemeral layer.
      SESSION_DB_PATH: /app/sessions/sessions.sqlite3
    volumes:
      # Keep sessions across `docker compose up` restarts. Holds live Up tokens.
      - sessions:/app/sessions
    restart: unless-stopped

volumes:
  sessions:
